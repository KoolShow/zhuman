<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="128x128" href="./icon_back.png" />
    <script type="text/javascript">
        var phoneWidth = parseInt(window.screen.width);
        var phoneScale = phoneWidth / 640;
        var ua = navigator.userAgent;
        if (/Android (\d+\.\d+)/.test(ua)) {
            var version = parseFloat(RegExp.$1);
            if (version > 2.3) {
                document.write('<meta name="viewport" content="width=640, minimum-scale = ' + phoneScale + ', maximum-scale = ' + phoneScale + ', target-densitydpi=device-dpi">');
            } else {
                document.write('<meta name="viewport" content="width=640, target-densitydpi=device-dpi">');
            }
        } else {
            document.write('<meta name="viewport" content="width=640, user-scalable=no, target-densitydpi=device-dpi">');
        }
    </script>

    <title>瀚曰加密</title>
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>

<body>
    <script type="text/javascript" src="./pako.min.js"></script>
    <script type="text/javascript" src="./main.js"></script>
    <script>
        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split("&");
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split("=");
                if (pair[0] == variable) {
                    return pair[1] || true;
                }
            }
            return (false);
        };
        if (getQueryVariable("zrjj")) {
            document.write('<script type="text/javascript" src="./notzhuman.js">\<\/script\>')
        } else {
            alert("新增ios保存至桌面支持!");
        };
    </script>

    <textarea id="jia" placeholder="请输入要加密的内容"></textarea><br>
    <div class="dropdown">
        <input type="button" value="↓加密↓" onclick="Decode()" class="dropbtn">
        <div class="dropdown-content">
            <a href="javascript:;" onclick="setLevel(1);">1(最快)</a>
            <a href="javascript:;" onclick="setLevel(2);">2</a>
            <a href="javascript:;" onclick="setLevel(3);">3</a>
            <a href="javascript:;" onclick="setLevel(4);">4</a>
            <a href="javascript:;" onclick="setLevel(5);">5</a>
            <a href="javascript:;" onclick="setLevel(6);">6</a>
            <a href="javascript:;" onclick="setLevel(7);">7</a>
            <a href="javascript:;" onclick="setLevel(8);">8</a>
            <a href="javascript:;" onclick="setLevel(9);">9(默认,最小)</a>
        </div>
    </div>
    <input type="button" value="↑解密↑" onclick="Encode()">
    <textarea id="jie" placeholder="请输入要解密的内容"></textarea>
</body>

</html>
